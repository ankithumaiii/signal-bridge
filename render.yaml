services:
  - type: web
    name: signal-bridge
    env: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build && npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: true
